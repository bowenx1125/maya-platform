    <script>
      if (new URLSearchParams(location.search).has("collapsed")) {
        document.documentElement.classList.add("collapsed");
      }
      document.querySelectorAll("[aria-haspopup='menu']").forEach((button) => {
        const menu = document.getElementById(
          button.getAttribute("aria-controls"),
        );
        if (!menu) return;
        const items = () => [
          ...menu.querySelectorAll("[role='menuitemradio']"),
        ];
        button.addEventListener("keydown", (event) => {
          if (
            event.key !== "ArrowDown" &&
            event.key !== "Enter" &&
            event.key !== " "
          )
            return;
          event.preventDefault();
          button.setAttribute("aria-expanded", "true");
          menu.hidden = false;
          items()[0]?.focus();
        });
        menu.addEventListener("keydown", (event) => {
          const list = items();
          const index = list.indexOf(document.activeElement);
          if (event.key === "Escape") {
            event.preventDefault();
            button.setAttribute("aria-expanded", "false");
            menu.hidden = true;
            button.focus();
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            list[Math.min(list.length - 1, index + 1)]?.focus();
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            list[Math.max(0, index - 1)]?.focus();
          } else if (event.key === "Home") {
            event.preventDefault();
            list[0]?.focus();
          } else if (event.key === "End") {
            event.preventDefault();
            list[list.length - 1]?.focus();
          }
        });
      });
    </script>
