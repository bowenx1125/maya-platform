<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Lexend:wght@400;500;700;800&display=swap"
    />
    <script>
      /* tailwind browser build inlined at render */
    </script>
  </head>
  <body class="m-0 font-[Lexend] text-[#111]">
    <div
      class="flex flex-col min-h-screen bg-[#DCEBFF] bg-[linear-gradient(#CDDBEE_1px,transparent_1px),linear-gradient(90deg,#CDDBEE_1px,transparent_1px)] bg-[size:32px_32px]"
    >
      <div
        class="h-12 bg-[#FFE14D] border-b-[3px] border-[#111] flex items-center px-3 relative"
      >
        <span
          class="size-8 rounded-md border-[3px] border-[#111] bg-white grid place-items-center shadow-[2px_2px_0_#111]"
          ><svg
            aria-hidden="true"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 7h16M4 12h16M4 17h16" /></svg></span
        ><span
          class="absolute left-1/2 -translate-x-1/2 font-[Bricolage_Grotesque] font-extrabold text-lg"
          >Mayaform</span
        >
      </div>
      <main class="flex-1 min-w-0 px-4 py-5">
        <div class="flex items-center justify-between gap-3">
          <h1
            class="font-[Bricolage_Grotesque] font-extrabold text-3xl bg-white border-[3px] border-[#111] rounded-[10px] px-4 py-1 shadow-[6px_6px_0_#111] -rotate-1"
          >
            Chatform
          </h1>
          <div class="flex gap-3"></div>
        </div>
        <div class="mt-8 flex flex-col gap-6">
          <aside
            aria-label="History"
            class="w-full shrink-0 rounded-[12px] border-[3px] border-[#111] bg-white shadow-[6px_6px_0_#111] flex flex-col gap-2"
          >
            <h2
              class="font-[Bricolage_Grotesque] text-xl font-extrabold px-3 py-2 border-b-[3px] border-[#111] bg-[radial-gradient(#111_1px,transparent_1.4px)] bg-[size:8px_8px]"
            >
              <span class="bg-white px-1">History</span>
            </h2>
            <p
              class="m-2 rounded-md border-2 border-dashed border-[#111]/40 p-3 text-center text-sm font-bold text-[#4B5563]"
            >
              No chats yet.
            </p>
            <div class="flex flex-col"></div>
          </aside>
          <section
            class="flex-1 min-w-0 rounded-[12px] border-[2px] border-[#111] bg-white shadow-[6px_6px_0_#111] flex flex-col min-h-[460px] items-center justify-center gap-5 p-8 text-center"
          >
            <div class="mx-auto flex gap-2" aria-hidden="true">
              <span
                class="size-12 grid place-items-center rounded-[10px] border-[3px] border-[#111] bg-white text-xl font-black shadow-[0_6px_0_#111]"
                >1</span
              ><span
                class="size-12 grid place-items-center rounded-[10px] border-[3px] border-[#111] bg-white text-xl font-black shadow-[0_6px_0_#111]"
                >2</span
              ><span
                class="size-12 grid place-items-center rounded-[10px] border-[3px] border-[#111] bg-white text-xl font-black shadow-[0_6px_0_#111]"
                >3</span
              >
            </div>
            <p class="text-sm font-bold text-[#4B5563] max-w-[300px]">
              Choose a chat from History, or press New to start one.
            </p>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
