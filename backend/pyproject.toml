[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "maya-backend"
version = "0.1.0"
description = "Maya teaching platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agno==3.0.11",
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "rapidocr==3.9.2",
  "onnxruntime==1.30.0",
  "pypdfium2==5.13.0",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
  "cryptography==42.0.5",
  "psycopg[binary]==3.2.10",
  "pypinyin==0.55.0",
  "dashscope==2.0.4",
]

[project.scripts]
maya-seed = "app.seed:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["yaml", "pypinyin", "pypinyin.*", "dashscope", "dashscope.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
