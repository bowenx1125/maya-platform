name: Final cleanup formatting

on:
  push:
    branches:
      - sol/repository-cleanup-handoff

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: sol/repository-cleanup-handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the remaining active files
        run: |
          pnpm exec prettier --write \
            README.md \
            docs/FILE_MAP.md \
            scripts/test_repo_boundary.mjs
          rm .github/workflows/format-final.yml

      - name: Commit the final formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/FILE_MAP.md scripts/test_repo_boundary.mjs .github/workflows/format-final.yml
          git commit -m "style: finish cleanup formatting"
          git push origin HEAD:sol/repository-cleanup-handoff
