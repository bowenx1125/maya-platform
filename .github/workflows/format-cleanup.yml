name: One-shot cleanup formatting

on:
  push:
    branches:
      - sol/repository-cleanup-handoff

permissions:
  contents: write

jobs:
  format-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: 0.12.0

      - name: Install Python dependencies
        run: uv sync --directory backend --frozen

      - name: Apply pinned formatters
        run: |
          pnpm exec prettier --write \
            README.md \
            config/repository-data-policy.json \
            docs/FILE_MAP.md \
            scripts/check_repo_boundary.mjs \
            scripts/test_repo_boundary.mjs
          uv run --directory backend ruff format app tests migrations

      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md config/repository-data-policy.json docs/FILE_MAP.md \
            scripts/check_repo_boundary.mjs scripts/test_repo_boundary.mjs \
            backend/app backend/tests backend/migrations
          git commit -m "style: apply pinned Prettier and Ruff formatting"
          git push origin HEAD:sol/repository-cleanup-handoff
