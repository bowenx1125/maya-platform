name: Finalize repository cleanup once

on:
  push:
    branches:
      - sol/repository-cleanup-handoff

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sol/repository-cleanup-handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply final text and mechanical cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def update(path: str, replacements: list[tuple[str, str]]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              original = text
              for old, new in replacements:
                  if old not in text:
                      print(f"note: expected text not found in {path}: {old[:80]!r}")
                  text = text.replace(old, new)
              if text != original:
                  target.write_text(text, encoding="utf-8")
                  print(f"updated {path}")

          update(
              "README.md",
              [
                  ("├── private-inputs/voice/            approved team voice sample for future voice work\n", ""),
                  ("- the approved voice sample under `private-inputs/voice/`;\n", ""),
                  (
                      "This repository is private and contains Demo account passwords and an approved personal voice sample. Do not make it public or redistribute those files without replacing/removing them and completing the relevant privacy and asset-license review.",
                      "This repository is private and contains private-team Demo account passwords. Do not make it public or redistribute those credential files without replacing/removing them and completing the relevant privacy review.",
                  ),
                  (
                      "- [`开发文档.xlsx`](开发文档.xlsx) — project overview, Wave progress, unaudited code, and delivery plan.\n",
                      "- [`开发文档.xlsx`](开发文档.xlsx) — project overview, Wave progress, unaudited code, and delivery plan.\n- [`scripts/build_development_workbook.py`](scripts/build_development_workbook.py) — reproducibly rebuilds the workbook after authoritative status changes.\n",
                  ),
              ],
          )

          update(
              "Project.md",
              [
                  ("- the approved voice sample under `private-inputs/voice/`.\n", ""),
                  (
                      "2. Upgrade GitHub Actions from the old Wave 2-shaped serial job to a Wave 3 matrix so unrelated checks still run when one job fails.",
                      "2. Keep the Wave 3 multi-job quality matrix reproducible and close its remaining contract, backend, and frontend failures.",
                  ),
              ],
          )

          update(
              "docs/PROJECT_STATUS.md",
              [
                  (
                      "- source code, contracts, migrations, tests, Demo credentials, and the approved voice sample are retained;",
                      "- source code, contracts, migrations, tests, and the two approved Demo credential files are retained;",
                  ),
                  (
                      "- repository policy is adjusted to permit only the two approved Demo credential files and the approved voice-sample directory;",
                      "- repository policy is adjusted to permit only the two approved Demo credential files;",
                  ),
                  (
                      "### Voice input\n\n- `private-inputs/voice/**`.\n\nThe approved personal voice sample is retained because it is an explicit future voice/TTS integration input. Generated debate audio is not retained.\n\n",
                      "",
                  ),
                  ("approved voice sample retained\n", ""),
                  (
                      "2. Upgrade CI to a Wave 3 multi-job quality matrix.",
                      "2. Keep the Wave 3 multi-job quality matrix reproducible and close its remaining contract, backend, and frontend failures.",
                  ),
              ],
          )

          update(
              "docs/FILE_MAP.md",
              [
                  (
                      "## `private-inputs/voice/`\n\n保留用户明确批准的本人音色样本，用于未来独立语音 Gate。它不是运行数据库，也不能被 Web 服务作为公开静态资源暴露。\n\n",
                      "",
                  ),
                  (
                      "| `test_repo_boundary.mjs`       | 使用临时探针验证边界检查不会漏报。                    |\n",
                      "| `test_repo_boundary.mjs`       | 使用临时探针验证边界检查不会漏报。                    |\n| `build_development_workbook.py` | 依据当前权威状态重建根目录唯一 `开发文档.xlsx`。      |\n",
                  ),
              ],
          )

          update(
              "UPLOAD_SCOPE.md",
              [
                  ("- approved voice input files under `private-inputs/voice/`;\n", ""),
                  (
                      "1. remove or replace the Demo credential files;\n2. remove the personal voice sample;\n3. review Avatar and third-party asset licenses;\n4. confirm no credentials exist in reachable Git history;\n5. rerun repository policy and generated-source scans.",
                      "1. remove or replace the Demo credential files;\n2. review Avatar and third-party asset licenses;\n3. confirm no credentials exist in reachable Git history;\n4. rerun repository policy and generated-source scans.",
                  ),
              ],
          )

          update(
              "AGENTS.md",
              [
                  (
                      "4. This private team repository intentionally tracks only these private Demo assets:\n   - `backend/config/demo-accounts/accounts.private.md`;\n   - `backend/config/demo_users.yaml`;\n   - approved voice samples under `private-inputs/voice/`.\n",
                      "4. This private team repository intentionally tracks only these two private Demo credential files:\n   - `backend/config/demo-accounts/accounts.private.md`;\n   - `backend/config/demo_users.yaml`.\n",
                  ),
              ],
          )

          policy_path = Path("config/repository-data-policy.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          policy["allowed_private_prefixes"] = []
          policy_path.write_text(
              json.dumps(policy, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          update(
              "backend/app/modules/debates/playback/sql_repository.py",
              [
                  (
                      '                        "(SELECT COUNT(*) FROM debate_turns t WHERE t.debate_id=d.id) AS total_turns, "',
                      '                        "(SELECT COUNT(*) FROM debate_turns t "\n                        "WHERE t.debate_id=d.id) AS total_turns, "',
                  ),
                  (
                      '                        "AND EXISTS (SELECT 1 FROM course_members cm WHERE cm.course_id=d.course_id "',
                      '                        "AND EXISTS (SELECT 1 FROM course_members cm "\n                        "WHERE cm.course_id=d.course_id "',
                  ),
              ],
          )

          generator_path = Path("scripts/generate_route_fixture.mjs")
          generator = generator_path.read_text(encoding="utf-8")
          marker = '  "getDebateTranscript",\n  "streamRetainedTurnAudio",'
          additions = '''  "getDebateTranscript",
  "getTeacherInteraction",
  "openInteraction",
  "closeInteraction",
  "getClassroomInteractionForm",
  "submitVote",
  "submitBarrage",
  "getCurrentReport",
  "regenerateReport",
  "listReportRevisions",
  "getReportRevision",
  "downloadCurrentReport",
  "listTranslationBatches",
  "translateCurrentPublishedContent",
  "streamRetainedTurnAudio",'''
          if marker not in generator:
              raise SystemExit("could not locate route operation marker")
          generator_path.write_text(generator.replace(marker, additions), encoding="utf-8")

          test_path = Path("scripts/test_route_surface.mjs")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              'const fixture = resolve(root, "contracts/fixtures/route-surface-server.json");\n',
              "",
          )
          test = test.replace(
              '  const generatedPath = resolve(tempDir, "route-surface-server.json");\n',
              '  const generatedPath = resolve(tempDir, "route-surface-server.json");\n  const generatedAgainPath = resolve(tempDir, "route-surface-server-again.json");\n',
          )
          test = test.replace(
              '  if (!readFileSync(generatedPath).equals(readFileSync(fixture)))\n    throw new Error("route fixture generator output is not deterministic");\n\n  const positive = run(process.execPath, [\n    comparator,\n    "--server-openapi",\n    fixture,\n  ]);',
              '  const generatedAgain = run(process.execPath, [\n    generator,\n    "--output",\n    generatedAgainPath,\n  ]);\n  if (generatedAgain.status !== 0)\n    throw new Error(\n      generatedAgain.stderr ||\n        generatedAgain.stdout ||\n        "second route fixture generation failed",\n    );\n  if (!readFileSync(generatedPath).equals(readFileSync(generatedAgainPath)))\n    throw new Error("route fixture generator output is not deterministic");\n\n  const positive = run(process.execPath, [\n    comparator,\n    "--server-openapi",\n    generatedPath,\n  ]);',
          )
          test = test.replace(
              '  const base = JSON.parse(readFileSync(fixture, "utf8"));',
              '  const base = JSON.parse(readFileSync(generatedPath, "utf8"));',
          )
          test = test.replace(
              '  if (platformOperationCount !== 53 || placeholderCount !== 13) {\n    throw new Error(\n      `pre-Wave3 route target drifted: ${platformOperationCount} implemented / ${placeholderCount} placeholders`,\n    );\n  }',
              '  if (platformOperationCount !== 66 || placeholderCount !== 0) {\n    throw new Error(\n      `Wave 3 route target drifted: ${platformOperationCount} implemented / ${placeholderCount} placeholders`,\n    );\n  }',
          )
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Build synchronized development workbook
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          python scripts/build_development_workbook.py

      - name: Commit finalized cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Project.md AGENTS.md UPLOAD_SCOPE.md docs config scripts backend/app/modules/debates/playback/sql_repository.py 开发文档.xlsx
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "chore: finalize clean repository handoff"
          git push origin HEAD:sol/repository-cleanup-handoff
