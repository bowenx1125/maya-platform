name: Maya Wave 3 quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  MAYA_ENV: test
  LLM_PROVIDER: mock
  EMBEDDING_PROVIDER: mock
  TTS_PROVIDER: mock
  VOICE_PROVIDER: mock
  TRANSLATION_PROVIDER: mock
  DEMO_MODE: "false"

jobs:
  deterministic:
    runs-on: ubuntu-latest
    # Production runs PostgreSQL; the classroom concurrency and playback
    # compatibility tests run against it here (MAYA_TEST_POSTGRES_URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: maya-ci
          POSTGRES_DB: maya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out product repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Assert foundation backend inputs
        run: |
          test -f backend/app/main.py
          test -f backend/pyproject.toml
          test -f backend/uv.lock
          test -d backend/migrations
          test -d backend/tests

      - name: Assert Wave 1A backend inputs
        run: |
          test -f backend/migrations/versions/0002_wave1_agents_rag.py
          test -f backend/tests/test_wave1_agents_knowledge.py
          test -f scripts/test_wave1_migration.py
          test -d backend/app/modules/agents
          test -d backend/app/modules/knowledge

      - name: Assert Wave 1B and 1C inputs
        run: |
          test -f backend/migrations/versions/0003_wave1b_avatar_voice.py
          test -f backend/tests/test_wave1b_avatars.py
          test -f backend/tests/test_wave1b_voices.py
          test -f scripts/enroll_system_fallback.py
          test -d backend/app/modules/avatars
          test -d backend/app/modules/voices
          test -d backend/app/providers
          test -d frontend/components/avatar
          test -d frontend/components/locale
          test -d frontend/components/voice
          test -f frontend/tests/avatar.test.tsx
          test -f frontend/tests/voice.test.tsx
          test -f frontend/tests/wave1c-m02.test.tsx
          test -f frontend/tests/wave1c-workbench-locale.integration.test.tsx
          test -f frontend/public/avatars/female_1.glb
          test -f frontend/public/avatars/NOTICE.md
          test -f frontend/public/avatars/LICENSE-draco.txt
          test -f frontend/public/avatars/LICENSE-motion-engine.txt
          test -f frontend/public/avatars/LICENSE-threejs.txt
          test -f frontend/public/avatars/draco/draco_decoder.js
          test -f frontend/public/avatars/draco/draco_decoder.wasm
          test -f frontend/public/avatars/draco/draco_wasm_wrapper.js

      - name: Assert Wave 2 inputs
        run: |
          test -f backend/migrations/versions/0004_wave2_debate_playback.py
          test -f backend/tests/test_wave2_setup.py
          test -f backend/tests/test_wave2_generation.py
          test -f backend/tests/test_wave2_playback.py
          test -f scripts/test_wave2_migration.py
          test -d backend/app/modules/debates/setup
          test -d backend/app/modules/debates/generation
          test -d backend/app/modules/debates/playback
          test -f backend/app/providers/llm.py
          test -d frontend/components/debate/setup
          test -d frontend/components/debate/stage
          test -f frontend/tests/wave2-setup.test.tsx
          test -f frontend/tests/wave2-playback.test.tsx

      - name: Assert Wave 3 inputs
        run: |
          test -f backend/migrations/versions/0007_wave3_interaction_report.py
          test -f backend/tests/test_wave3_interactions.py
          test -f backend/tests/test_wave3_reports.py
          test -f backend/tests/test_wave3_playback_controls.py
          test -f scripts/test_wave3_migration.py
          test -d backend/app/modules/interactions
          test -d backend/app/modules/reports
          test -f frontend/tests/wave3-interaction.test.tsx
          test -f frontend/tests/wave3-report.test.tsx

      - name: Assert Wave 4 inputs
        run: |
          test -f backend/migrations/versions/0008_wave4_mutual_learning_rounds.py
          test -f backend/migrations/versions/0009_persona_structured_fields.py
          test -f backend/migrations/versions/0010_provider_control_ledger.py
          test -f backend/migrations/versions/0011_evidence_trace_json.py
          test -f backend/migrations/versions/0012_persona_activation.py
          test -f backend/migrations/versions/0013_embedding_identity_stage.py
          test -f scripts/test_wave4_migration.py
          test -f scripts/test_wave4_evidence_migration.py
          test -f scripts/test_wave4_embedding_identity_migration.py
          test -f scripts/import_provider_policy.py
          test -f scripts/test_import_provider_policy.py
          test -f scripts/import_llm_policy.py
          test -f scripts/test_import_llm_policy.py
          test -f scripts/reset_demo_runtime.py
          test -f scripts/test_reset_demo_runtime.py
          test -f backend/tests/test_wave4_mutual_learning.py
          test -f backend/tests/test_wave4_persona_persistence.py
          test -f backend/tests/test_wave4_persona_activation_migration.py
          test -f backend/tests/test_wave4_provider_control_orm.py
          test -f backend/tests/test_wave4_provider_preflight.py
          test -f backend/tests/test_wave4_embedding_runtime.py
          test -f backend/tests/test_wave4_embedding_sql_runtime.py
          test -f backend/tests/test_wave4_embedding_http_transport.py
          test -f backend/tests/test_wave4_embedding_identity_orm.py
          test -f backend/tests/test_wave4_embedding_identity_search.py
          test -f backend/tests/test_wave4_embedding_generation_query.py
          test -f backend/tests/test_wave4_embedding_playback_retry.py
          test -f backend/tests/test_wave4_embedding_sql_query.py
          test -f backend/tests/test_wave4_prompt.py
          test -f backend/tests/test_wave4_evidence_trace.py
          test -f frontend/tests/wave4-mutual-learning.test.tsx
          test -f frontend/tests/wave4-evidence-trace.test.tsx
          test -f frontend/tests/wave4-provider-preflight.test.tsx

      - name: Assert portable project authority
        run: |
          test -f docs/PROJECT.md
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f docs/ARCHITECTURE.md
          test ! -e Project.md
          test ! -e PROJECT_STATUS.md

      - name: Frozen JavaScript install
        run: pnpm install --frozen-lockfile

      - name: Repository formatting
        run: pnpm exec prettier --check .

      - name: Project authority and document links
        run: pnpm docs:check

      - name: Frozen parent OpenAPI and generated client checks
        run: |
          node scripts/check_frozen_openapi.mjs
          node scripts/test_frozen_openapi.mjs
          node scripts/check_generated_contracts.mjs

      - name: Redocly contract lint
        run: pnpm exec redocly lint --config contracts/redocly.yaml contracts/openapi-v0.1.yaml

      - name: Explicit frozen response-contract check
        run: |
          node scripts/check_openapi_responses.mjs
          node scripts/test_openapi_responses.mjs

      - name: WebSocket schema generation and Ajv contract tests
        run: |
          node scripts/test_ws_events.mjs
          node scripts/test_ws_commands.mjs

      - name: WebSocket generator clean-diff check
        run: node scripts/check_generated_ws.mjs

      - name: Latin script table clean-diff check
        run: node scripts/check_latin_script_tables.mjs

      - name: Route semantic comparator fixtures
        run: node scripts/test_route_surface.mjs

      - name: Product repository boundary and secret scan
        run: node scripts/check_repo_boundary.mjs

      - name: Generated-source secret scan probe
        run: node scripts/test_repo_boundary.mjs

      - name: Frontend lint, types, tests, and build
        run: |
          pnpm --filter @maya/frontend lint
          pnpm --filter @maya/frontend typecheck
          pnpm --filter @maya/frontend test
          pnpm --filter @maya/frontend build

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: 0.12.0

      - name: Backend dependency sync
        run: uv sync --directory backend --frozen

      - name: Install FFmpeg for voice boundary tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version

      - name: Local Demo initializer safety probe
        run: uv run --directory backend python ../scripts/test_bootstrap_local_demo.py

      - name: Real-Core offline importer checks
        run: |
          uv run --directory backend pytest -q \
            ../scripts/test_import_provider_policy.py \
            ../scripts/test_import_llm_policy.py \
            tests/test_real_core_dual_composition.py
          uv run --directory backend python ../scripts/test_reset_demo_runtime.py

      - name: Wave 3 backend tests and migration smoke
        working-directory: backend
        env:
          MAYA_TEST_POSTGRES_URL: postgresql+psycopg://postgres:maya-ci@127.0.0.1:5432/maya_test
        run: |
          uv run ruff format --check app tests migrations/versions/0004_wave2_debate_playback.py migrations/versions/0006_pre_wave3_polish.py migrations/versions/0007_wave3_interaction_report.py
          uv run ruff check app
          uv run ruff check tests
          uv run ruff check migrations
          uv run mypy app
          uv run pytest tests/test_wave1_agents_knowledge.py
          uv run pytest tests/test_wave1b_avatars.py tests/test_wave1b_voices.py
          uv run pytest

      - name: Empty database migration smoke
        run: |
          empty_root="$(mktemp -d)"
          DATABASE_URL="sqlite:///$empty_root/maya.sqlite3" uv run --directory backend alembic upgrade head
          DATABASE_URL="sqlite:///$empty_root/maya.sqlite3" uv run --directory backend alembic upgrade head

      - name: Populated Wave 1A migration preservation evidence
        run: uv run --directory backend python ../scripts/test_wave1_migration.py

      - name: Populated Wave 2 migration preservation evidence
        run: uv run --directory backend python ../scripts/test_wave2_migration.py

      - name: Populated Wave 3 migration preservation evidence
        run: uv run --directory backend python ../scripts/test_wave3_migration.py

      - name: Populated Wave 4 migration preservation evidence
        run: uv run --directory backend python ../scripts/test_wave4_migration.py

      - name: Evidence Trace migration preservation evidence
        run: uv run --directory backend python ../scripts/test_wave4_evidence_migration.py

      - name: Export Wave 4 FastAPI OpenAPI for route comparison
        run: uv run --directory backend python ../scripts/export_fastapi_openapi.py "$RUNNER_TEMP/maya-fastapi-openapi.json"

      - name: Strict Wave 4 FastAPI route and schema comparison
        run: node scripts/compare_route_surface.mjs --server-openapi "$RUNNER_TEMP/maya-fastapi-openapi.json"

      - name: Compose configuration
        run: docker compose config --quiet

  login-load-regression:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:maya-ci@127.0.0.1:5432/maya_test
      ADAPTIVE_ADMISSION_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: maya-ci
          POSTGRES_DB: maya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out product repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: 0.12.0

      - name: Backend dependency sync
        run: uv sync --directory backend --frozen

      - name: Migrate login regression database
        run: uv run --directory backend alembic upgrade head

      - name: Start login regression API
        working-directory: backend
        run: |
          mkdir -p artifacts
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/login-load-api.log" 2>&1 &

      - name: Wait for login regression API
        run: |
          for attempt in {1..60}; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8000/health/ready)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/login-load-api.log"
          exit 1

      - name: Register login regression accounts
        run: |
          for index in {0..19}; do
            username="$(printf 'loadtune-%03d' "$index")"
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 30 --request POST \
              --header 'Content-Type: application/json' \
              --header 'Origin: http://127.0.0.1:8000' \
              --data "{\"username\":\"$username\",\"password\":\"load-tune-password-1\",\"group_name\":\"Load tune\"}" \
              http://127.0.0.1:8000/api/v1/auth/register)"
            case "$status" in
              200|201|409) ;;
              *) echo "Registration failed for $username: HTTP $status" >&2; exit 1 ;;
            esac
          done

      - name: Login load regression
        run: uv run --directory backend python ../scripts/load_tune.py --profile login-ci --base-url http://127.0.0.1:8000 --json-out artifacts/login-load.json

      - name: Upload login load report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: login-load-regression
          # uv --directory backend resolves --json-out from backend.
          path: backend/artifacts/login-load.json
          if-no-files-found: error
