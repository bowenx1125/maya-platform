name: One-time repository formatting

on:
  push:
    branches:
      - sol/repository-cleanup-handoff
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: normalize repository formatting'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sol/repository-cleanup-handoff
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
        with:
          version: 0.12.0

      - name: Install Python dependencies
        run: uv sync --directory backend --frozen

      - name: Apply deterministic formatters
        run: |
          pnpm exec prettier --write .
          uv run --directory backend ruff format app tests migrations

      - name: Remove one-time workflow and commit formatting
        run: |
          rm .github/workflows/format-once.yml
          git config user.name "maya-format-bot"
          git config user.email "maya-format-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
          else
            git commit -m "style: normalize repository formatting"
            git push origin HEAD:sol/repository-cleanup-handoff
          fi
