name: Final one-shot Prettier cleanup

on:
  push:
    branches:
      - sol/repository-cleanup-handoff
    paths:
      - .github/workflows/format-last.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: sol/repository-cleanup-handoff
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier to the four remaining files
        run: |
          pnpm exec prettier --write \
            config/repository-data-policy.json \
            docs/PROJECT_STATUS.md \
            frontend/components/debate/stage/debate-stage.tsx \
            Project.md

      - name: Remove helper and commit formatting-only changes
        run: |
          rm .github/workflows/format-last.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: finish repository formatting"
          git push origin HEAD:sol/repository-cleanup-handoff
