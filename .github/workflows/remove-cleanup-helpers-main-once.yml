name: Remove cleanup helpers from main once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Remove cleanup helper workflows and self
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-cleanup-once.yml \
            .github/workflows/remove-cleanup-helpers-once.yml \
            .github/workflows/remove-cleanup-helpers-main-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: remove temporary cleanup helpers"
          git push origin HEAD:main
