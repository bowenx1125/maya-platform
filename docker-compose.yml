services:
  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "8080:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - maya

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_RUNTIME_MODE: ${NEXT_PUBLIC_RUNTIME_MODE:-container}
        NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:-local}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_RUNTIME_MODE: ${NEXT_PUBLIC_RUNTIME_MODE:-container}
      NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:-local}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health').then((response) => {
          process.exit(response.ok ? 0 : 1); }).catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - maya

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_QUICK_LOGIN: ${DEMO_QUICK_LOGIN:-true}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CLASSROOM_PUBLIC_BASE_URL: ${CLASSROOM_PUBLIC_BASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/maya.sqlite3}
      DATA_ROOT: ${DATA_ROOT:-/app/data}
      DEMO_USERS_FILE: ${DEMO_USERS_FILE:-/app/config/demo_users.yaml}
      DEMO_ACCOUNTS_FILE: ${DEMO_ACCOUNTS_FILE:-/app/config/demo-accounts/accounts.private.md}
      ALLOW_LEGACY_DEMO_USERS: ${ALLOW_LEGACY_DEMO_USERS:-false}
      MAYA_ENV: ${MAYA_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MAYA_REPORT_PROVIDER: ${MAYA_REPORT_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
      DASHSCOPE_REGION: ${DASHSCOPE_REGION:-}
      EMBEDDING_PROVIDER_POLICY_HASH: ${EMBEDDING_PROVIDER_POLICY_HASH:-}
      LLM_PROVIDER_POLICY_HASH: ${LLM_PROVIDER_POLICY_HASH:-}
      REPORT_PROVIDER_POLICY_HASH: ${REPORT_PROVIDER_POLICY_HASH:-}
      PROVIDER_POLICY_HASH: ${PROVIDER_POLICY_HASH:-}
      LLM_PRICE_CARD_VERSION: ${LLM_PRICE_CARD_VERSION:-}
      LLM_INPUT_PRICE_CNY_PER_MILLION: ${LLM_INPUT_PRICE_CNY_PER_MILLION:-}
      LLM_CACHED_INPUT_PRICE_CNY_PER_MILLION: ${LLM_CACHED_INPUT_PRICE_CNY_PER_MILLION:-}
      LLM_OUTPUT_PRICE_CNY_PER_MILLION: ${LLM_OUTPUT_PRICE_CNY_PER_MILLION:-}
      LLM_PRICE_CARD_RETRIEVED_AT: ${LLM_PRICE_CARD_RETRIEVED_AT:-}
      LLM_PRICE_CARD_SOURCE_CONTENT_SHA256: ${LLM_PRICE_CARD_SOURCE_CONTENT_SHA256:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-}
      FALLBACK_VOICE_PROFILE_ID: ${FALLBACK_VOICE_PROFILE_ID:-}
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./backend/config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    networks:
      - maya

networks:
  maya:
    driver: bridge
