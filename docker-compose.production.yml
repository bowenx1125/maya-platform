services:
  gateway:
    restart: unless-stopped
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      MAYA_DOMAIN: ${MAYA_DOMAIN:?Set MAYA_DOMAIN to the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notices}
    volumes: !override
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - maya_caddy_data:/data
      - maya_caddy_config:/config
    networks: !override
      - maya_public
      - maya_backend

  frontend:
    restart: unless-stopped
    networks: !override
      - maya_public

  backend:
    restart: unless-stopped
    # Opt-in for the autoheal service below: restarted when it stays unhealthy.
    labels:
      com.maya.autoheal: "true"
    environment:
      NODE_ENV: production
      MAYA_ENV: production
      DEMO_MODE: "false"
      DEMO_QUICK_LOGIN: "false"
      DEMO_AUTO_CONFIRM_PROVIDER: "false"
      PROVIDER_STANDING_CONSENT: ${PROVIDER_STANDING_CONSENT:-false}
      DEMO_ACCOUNTS_FILE: ${MAYA_PRODUCTION_ACCOUNTS_FILE:-/app/config/production-accounts/accounts.private.md}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a managed value of at least 32 bytes}
      CLASSROOM_PUBLIC_BASE_URL: https://${MAYA_DOMAIN:?Set MAYA_DOMAIN to the public DNS name}
      DATABASE_URL: postgresql+psycopg://maya:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/maya
      AUTH_LOGIN_QUEUE_RETRY_SECONDS: ${AUTH_LOGIN_QUEUE_RETRY_SECONDS:-2}
      MEMORY_GUARD_MIN_AVAILABLE_MB: ${MEMORY_GUARD_MIN_AVAILABLE_MB:-500}
      MEMORY_GUARD_RESUME_AVAILABLE_MB: ${MEMORY_GUARD_RESUME_AVAILABLE_MB:-550}
      HOST_LOAD_REJECT_THRESHOLD: ${HOST_LOAD_REJECT_THRESHOLD:-6.0}
      HOST_LOAD_RESUME_THRESHOLD: ${HOST_LOAD_RESUME_THRESHOLD:-4.0}
      LLM_ADMISSION_LIMIT: ${LLM_ADMISSION_LIMIT:-8}
      LLM_ADMISSION_QUEUE_MAX: ${LLM_ADMISSION_QUEUE_MAX:-100}
      LLM_ADMISSION_WAIT_SECONDS: ${LLM_ADMISSION_WAIT_SECONDS:-180}
      LLM_ADMISSION_RETRY_SECONDS: ${LLM_ADMISSION_RETRY_SECONDS:-5}
      WRITE_GUARD_LIMIT: ${WRITE_GUARD_LIMIT:-8}
      WRITE_GUARD_QUEUE_MAX: ${WRITE_GUARD_QUEUE_MAX:-100}
      WRITE_GUARD_WAIT_SECONDS: ${WRITE_GUARD_WAIT_SECONDS:-180}
      WRITE_GUARD_RETRY_SECONDS: ${WRITE_GUARD_RETRY_SECONDS:-5}
      CREATE_ADMISSION_LIMIT: ${CREATE_ADMISSION_LIMIT:-8}
      CREATE_ADMISSION_QUEUE_MAX: ${CREATE_ADMISSION_QUEUE_MAX:-100}
      CREATE_ADMISSION_WAIT_SECONDS: ${CREATE_ADMISSION_WAIT_SECONDS:-180}
      CREATE_ADMISSION_RETRY_SECONDS: ${CREATE_ADMISSION_RETRY_SECONDS:-5}
      ADAPTIVE_ADMISSION_ENABLED: ${ADAPTIVE_ADMISSION_ENABLED:-true}
      ADAPTIVE_ADMISSION_MAX_IN_FLIGHT: ${ADAPTIVE_ADMISSION_MAX_IN_FLIGHT:-48}
      ADAPTIVE_ADMISSION_MAX_UNITS: ${ADAPTIVE_ADMISSION_MAX_UNITS:-128}
      ADAPTIVE_ADMISSION_INITIAL_UNITS: ${ADAPTIVE_ADMISSION_INITIAL_UNITS:-72}
      ADAPTIVE_ADMISSION_MIN_UNITS: ${ADAPTIVE_ADMISSION_MIN_UNITS:-4}
      ADAPTIVE_ADMISSION_QUEUE_MAX: ${ADAPTIVE_ADMISSION_QUEUE_MAX:-200}
      ADAPTIVE_ADMISSION_WAIT_SECONDS: ${ADAPTIVE_ADMISSION_WAIT_SECONDS:-180}
      ADAPTIVE_ADMISSION_RETRY_SECONDS: ${ADAPTIVE_ADMISSION_RETRY_SECONDS:-5}
      ADAPTIVE_ADMISSION_SOFT_LOAD: ${ADAPTIVE_ADMISSION_SOFT_LOAD:-4.0}
      ADAPTIVE_ADMISSION_SOFT_MEM_MB: ${ADAPTIVE_ADMISSION_SOFT_MEM_MB:-900}
      ADAPTIVE_ADMISSION_DB_WRITE_P95_MS: ${ADAPTIVE_ADMISSION_DB_WRITE_P95_MS:-500}
      ADAPTIVE_ADMISSION_POOL_WAIT_P95_MS: ${ADAPTIVE_ADMISSION_POOL_WAIT_P95_MS:-500}
      ADAPTIVE_ADMISSION_HOLD_LOAD: ${ADAPTIVE_ADMISSION_HOLD_LOAD:-3.0}
      ADAPTIVE_ADMISSION_HOLD_MEM_MB: ${ADAPTIVE_ADMISSION_HOLD_MEM_MB:-1100}
      ADAPTIVE_ADMISSION_HOLD_THREADPOOL_RATIO: ${ADAPTIVE_ADMISSION_HOLD_THREADPOOL_RATIO:-0.45}
      ADAPTIVE_ADMISSION_FAST_INCREASE_UNITS: ${ADAPTIVE_ADMISSION_FAST_INCREASE_UNITS:-4}
      ADAPTIVE_ADMISSION_IDLE_SECONDS: ${ADAPTIVE_ADMISSION_IDLE_SECONDS:-30}
      ADAPTIVE_ADMISSION_BRAKE_DB_WRITE_P95_MS: ${ADAPTIVE_ADMISSION_BRAKE_DB_WRITE_P95_MS:-800}
      ADAPTIVE_ADMISSION_BRAKE_POOL_WAIT_P95_MS: ${ADAPTIVE_ADMISSION_BRAKE_POOL_WAIT_P95_MS:-250}
      ADAPTIVE_ADMISSION_BRAKE_WRITES_IN_FLIGHT: ${ADAPTIVE_ADMISSION_BRAKE_WRITES_IN_FLIGHT:-10}
      ADAPTIVE_ADMISSION_BRAKE_CPU_RATIO: ${ADAPTIVE_ADMISSION_BRAKE_CPU_RATIO:-0.95}
      ADAPTIVE_ADMISSION_BRAKE_CPU_SAMPLES: ${ADAPTIVE_ADMISSION_BRAKE_CPU_SAMPLES:-3}
      ADAPTIVE_ADMISSION_BRAKE_COOLDOWN_SECONDS: ${ADAPTIVE_ADMISSION_BRAKE_COOLDOWN_SECONDS:-5}
      AUTH_HASH_CONCURRENCY: ${AUTH_HASH_CONCURRENCY:-2}
      # Debate generation defaults; the Debate form's parameter card overrides
      # them per Debate. Empty means not sent. Unset, they match prior behaviour.
      DEBATE_LLM_MODEL: ${DEBATE_LLM_MODEL:-}
      DEBATE_LLM_TEMPERATURE: ${DEBATE_LLM_TEMPERATURE:-0.65}
      DEBATE_LLM_TOP_P: ${DEBATE_LLM_TOP_P:-0.8}
      DEBATE_LLM_PRESENCE_PENALTY: ${DEBATE_LLM_PRESENCE_PENALTY:-}
      DEBATE_LLM_FREQUENCY_PENALTY: ${DEBATE_LLM_FREQUENCY_PENALTY:-}
      DEBATE_LLM_REPETITION_PENALTY: ${DEBATE_LLM_REPETITION_PENALTY:-}
      DEBATE_LLM_MAX_TOKENS: ${DEBATE_LLM_MAX_TOKENS:-}
      DEBATE_LLM_ENABLE_THINKING: ${DEBATE_LLM_ENABLE_THINKING:-false}
      DEBATE_LLM_SEED: ${DEBATE_LLM_SEED:-}
      DEBATE_LLM_TIMEOUT_SECONDS: ${DEBATE_LLM_TIMEOUT_SECONDS:-120}
      DEBATE_TTS_MODEL: ${DEBATE_TTS_MODEL:-}
      DEBATE_PLAYBACK_RATE: ${DEBATE_PLAYBACK_RATE:-1.25}
      DATA_ROOT: /app/data
      AUTH_TRUST_GATEWAY_X_FORWARDED_FOR: "true"
      AUTH_LOGIN_ACCOUNT_FAILURE_LIMIT: ${AUTH_LOGIN_ACCOUNT_FAILURE_LIMIT:-10}
      AUTH_LOGIN_CLIENT_FAILURE_LIMIT: ${AUTH_LOGIN_CLIENT_FAILURE_LIMIT:-240}
      AUTH_LOGIN_FAILURE_WINDOW_SECONDS: ${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      AUTH_REGISTER_CLIENT_LIMIT: ${AUTH_REGISTER_CLIENT_LIMIT:-120}
      AUTH_REGISTER_WINDOW_SECONDS: ${AUTH_REGISTER_WINDOW_SECONDS:-3600}
      AUTH_ABUSE_MAX_BUCKETS: ${AUTH_ABUSE_MAX_BUCKETS:-8192}
      DEBATE_AUDIO_MP3: ${DEBATE_AUDIO_MP3:-true}
    networks: !override
      - maya_backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    volumes: !override
      - ${MAYA_PRODUCTION_DATA_DIR:?Set a dedicated production data directory}:/app/data
      - ${MAYA_PRODUCTION_CONFIG_DIR:?Set a dedicated production config directory}:/app/config:ro
      - ./contracts:/app/contracts:ro

  # Docker restarts a container whose process exits, not one that hangs and is
  # only marked unhealthy. This watcher restarts a backend that stays unhealthy
  # (see infra/autoheal.sh and docs/RELEASE_POLICY.md "Automatic restart").
  autoheal:
    image: docker:29.9.1-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/autoheal.sh"]
    environment:
      AUTOHEAL_LABEL: com.maya.autoheal=true
      AUTOHEAL_INTERVAL_SECONDS: ${AUTOHEAL_INTERVAL_SECONDS:-20}
      AUTOHEAL_CONFIRM_CHECKS: ${AUTOHEAL_CONFIRM_CHECKS:-3}
      AUTOHEAL_COOLDOWN_SECONDS: ${AUTOHEAL_COOLDOWN_SECONDS:-300}
      AUTOHEAL_STOP_TIMEOUT_SECONDS: ${AUTOHEAL_STOP_TIMEOUT_SECONDS:-30}
      AUTOHEAL_DRY_RUN: ${AUTOHEAL_DRY_RUN:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/autoheal.sh:/autoheal.sh:ro
    network_mode: none

  postgres:
    restart: unless-stopped
    image: postgres:16.10-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: maya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: maya
    volumes:
      - maya_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maya -d maya"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: !override
      - maya_backend

networks:
  maya_public:
    driver: bridge
  maya_backend:
    driver: bridge

volumes:
  maya_caddy_data:
  maya_caddy_config:
  maya_postgres:
