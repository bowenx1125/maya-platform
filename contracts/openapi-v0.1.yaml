openapi: 3.1.0
info:
  title: Maya Teaching Platform API
  version: 0.1.0-g0.8-wave3
  description: >-
    Demo v0.1 platform contract. Supplier identity appears only in the
    teacher-only ProviderDataCallV1 disclosure. Model names, external resource
    IDs, API keys, absolute file paths, and prepared turn text are never public
    fields.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Organization
  - name: Knowledge
  - name: Agents
  - name: Voices
  - name: Debates
  - name: Interaction
  - name: Reports
  - name: Provider
  - name: Chat
  - name: Live
  - name: Provider settings
paths:
  /conversations:
    get:
      operationId: listConversations
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChatSession'
                title: Response Listconversations
                type: array
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: List Conversations
      tags:
      - Chat
    post:
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChat'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: Create Conversation
      tags:
      - Chat
  /conversations/{conversation_id}:
    get:
      operationId: getConversation
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          format: uuid
          title: Conversation Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: Get Conversation
      tags:
      - Chat
  /conversations/{conversation_id}/messages:
    post:
      operationId: sendConversationMessage
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          format: uuid
          title: Conversation Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChat'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      security:
      - sessionCookie: []
      summary: Send Message
      tags:
      - Chat
  /courses/{course_id}/chat-agents:
    get:
      operationId: listChatAgents
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          format: uuid
          title: Course Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChatAgent'
                title: Response Listchatagents
                type: array
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: List Agents
      tags:
      - Chat
  /courses/{course_id}/live:
    get:
      operationId: getClassroomLive
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          format: uuid
          title: Course Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/LiveSummary'
                - type: 'null'
                title: Response Getclassroomlive
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
      security:
      - sessionCookie: []
      summary: Live Status
      tags:
      - Live
  /courses/{course_id}/provider-settings:
    get:
      operationId: getProviderSettings
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          format: uuid
          title: Course Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: Get Provider Settings
      tags:
      - Provider settings
    post:
      operationId: updateProviderSettings
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          format: uuid
          title: Course Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderSettings'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: Update Provider Settings
      tags:
      - Provider settings
  /courses/{course_id}/provider-settings/{component}/check:
    post:
      operationId: checkProvider
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          format: uuid
          title: Course Id
          type: string
      - in: path
        name: component
        required: true
        schema:
          enum:
          - llm
          - embedding
          - report
          - tts
          - voice
          title: Component
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckProvider'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: Check Provider
      tags:
      - Provider settings
  /debates/{debate_id}/live:
    post:
      operationId: updateClassroomLive
      parameters:
      - in: path
        name: debate_id
        required: true
        schema:
          format: uuid
          title: Debate Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveHeartbeat'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/LiveSummary'
                - type: 'null'
                title: Response Updateclassroomlive
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      security:
      - sessionCookie: []
      summary: Heartbeat
      tags:
      - Live
  /live/{debate_id}:
    get:
      operationId: getLiveSnapshot
      parameters:
      - in: path
        name: debate_id
        required: true
        schema:
          format: uuid
          title: Debate Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSnapshot'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
      security:
      - sessionCookie: []
      summary: Get Live Snapshot
      tags:
      - Live
  /live/{debate_id}/audio/{turn_id}:
    get:
      operationId: getLiveAudio
      parameters:
      - in: path
        name: debate_id
        required: true
        schema:
          format: uuid
          title: Debate Id
          type: string
      - in: path
        name: turn_id
        required: true
        schema:
          format: uuid
          title: Turn Id
          type: string
      - in: header
        name: Range
        required: false
        schema:
          title: Range
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema: {}
            audio/wav:
              schema:
                format: binary
                type: string
          description: Successful Response
        '206':
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: Partial audio
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '416':
          description: Unsatisfiable range
      security:
      - sessionCookie: []
      summary: Live Audio
      tags:
      - Live
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created and CSRF token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401": { $ref: "#/components/responses/Error" }
  /auth/switch:
    post:
      tags: [Auth]
      operationId: switchDemoIdentity
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      description: Available only when DEMO_MODE=true; rotates the server session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: New session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /auth/demo-identities:
    get:
      tags: [Auth]
      security: []
      operationId: listDemoIdentities
      description: Anonymous safe catalog available only when DEMO_MODE and DEMO_QUICK_LOGIN are enabled; never returns passwords.
      responses:
        "200":
          description: Safe identity options.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [user_id, display_name, role]
                  properties:
                    user_id: { $ref: "#/components/schemas/Uuid" }
                    display_name: { type: string }
                    role: { type: string, enum: [teacher, student] }
        "404": { $ref: "#/components/responses/Error" }
  /auth/quick-login:
    post:
      tags: [Auth]
      security: []
      operationId: quickLogin
      description: Passwordless Demo identity selection; rotates any existing Session and CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoQuickLoginRequest" }
      responses:
        "200":
          description: Passwordless Demo session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/registration-options:
    get:
      tags: [Auth]
      security: []
      operationId: getRegistrationOptions
      description: Course and existing group names a new student may join. No member identity is exposed.
      responses:
        "200":
          description: Course and existing group names a new student may join.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationOptions" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: registerStudent
      description: Create a student account, attach it to a course group by name and start its Session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created and session started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user, memberships, refreshed CSRF token and session expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password-resets:
    post:
      tags: [Auth]
      operationId: resetStudentPassword
      description: Teacher-initiated password reset for one self-registered student in their course.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: The new password, returned exactly once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Session revoked. }

  /courses:
    get:
      tags: [Organization]
      operationId: listCourses
      responses:
        "200":
          description: Courses visible to current user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
  /courses/{course_id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Organization]
      operationId: getCourse
      responses:
        "200":
          description: Course detail and read-only members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /courses/{course_id}/groups:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Organization]
      operationId: listCourseGroups
      responses:
        "200":
          description: Seeded groups visible in this course.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
  /courses/{course_id}/roster:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Organization]
      operationId: getCourseRoster
      description: Members of a course the caller teaches, with account source and groups.
      responses:
        "200":
          description: Members with account source and groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseRoster" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /courses/{course_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Organization]
      operationId: updateCourseMember
      description: Rename a member, move them between groups or deactivate the account.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCourseMemberRequest" }
      responses:
        "200":
          description: The member after the edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterEntry" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Organization]
      operationId: getGroup
      responses:
        "200":
          description: Group and read-only members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /groups/{group_id}/membership:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Organization]
      operationId: joinGroupAsTeacher
      description: Join a group in a course the caller teaches. Idempotent.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The group after the caller joined it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Organization]
      operationId: leaveGroupAsTeacher
      description: Leave a group the caller teaches. Idempotent.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: The caller is no longer a member of this group. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /groups/{group_id}/knowledge-documents:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Knowledge]
      operationId: listKnowledgeDocuments
      responses:
        "200":
          description: Current group Markdown library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KnowledgeDocument" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Knowledge]
      operationId: uploadKnowledgeDocument
      description: Creates an immutable Markdown document; no content deduplication.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                target_agent_version_id: { $ref: "#/components/schemas/Uuid" }
                expected_revision: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Document stored and indexed; a target draft is updated only when explicitly supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocumentMutation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /knowledge-documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Knowledge]
      operationId: getKnowledgeDocument
      responses:
        "200":
          description: Group-scoped document metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
        "404": { $ref: "#/components/responses/Error" }
  /knowledge-documents/{document_id}/replace:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Knowledge]
      operationId: replaceKnowledgeDocument
      description: Creates an immutable copy-on-write replacement and atomically updates every current draft reference.
      parameters:
