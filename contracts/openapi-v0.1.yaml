    CurrentUser:
      type: object
      required: [id, username, display_name, courses, groups]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        username: { type: string }
        display_name: { type: string }
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseMembership" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupMembership" }
    CourseMembership:
      type: object
      required: [course_id, role]
      properties:
        course_id: { $ref: "#/components/schemas/Uuid" }
        role: { type: string, enum: [teacher, student] }
    GroupMembership:
      type: object
      required: [group_id, role]
      properties:
        group_id: { $ref: "#/components/schemas/Uuid" }
        role: { type: string, enum: [leader, admin, member] }
    Course:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        current_audio_debate_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          properties:
            members:
              type: array
              items: { $ref: "#/components/schemas/Member" }
    Group:
      type: object
      required: [id, course_id, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        course_id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          properties:
            members:
              type: array
              items: { $ref: "#/components/schemas/Member" }
    Member:
      type: object
      required: [user_id, display_name, role]
      properties:
        user_id: { $ref: "#/components/schemas/Uuid" }
        display_name: { type: string }
        role: { type: string }
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
    RosterEntry:
      type: object
      required: [user_id, username, display_name, role, status, source, editable]
      properties:
        user_id: { $ref: "#/components/schemas/Uuid" }
        username: { type: string }
        display_name: { type: string }
        role: { type: string }
        status: { type: string }
        source: { type: string }
        editable: { type: boolean }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupRef" }
    CourseRoster:
      type: object
      required: [course_id]
      properties:
        course_id: { $ref: "#/components/schemas/Uuid" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/RosterEntry" }
    UpdateCourseMemberRequest:
      type: object
      properties:
        display_name: { type: ["string", "null"] }
        group_name: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
    KnowledgeDocument:
      type: object
      required:
        [
          id,
          group_id,
          source_filename,
          char_count,
          content_hash,
          index_revision,
          index_status,
          workspace_state,
          created_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        group_id: { $ref: "#/components/schemas/Uuid" }
        source_filename: { type: string }
        char_count: { type: integer, minimum: 1 }
        content_hash:
          {
            type: string,
            minLength: 64,
            maxLength: 64,
            pattern: "^[0-9a-f]{64}$",
          }
        index_revision: { type: integer, minimum: 0 }
        index_status: { type: string, enum: [pending, indexing, ready, failed] }
        workspace_state: { type: string, enum: [active, hidden] }
        safe_error_code: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/IsoTime" }
    SnapshotDocument:
      type: object
      required: [id, source_filename, char_count, order_index]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        source_filename: { type: string }
        char_count: { type: integer, minimum: 1 }
        order_index: { type: integer, minimum: 0 }
    KnowledgeSnapshot:
      type: object
      required:
        [
          id,
          agent_version_id,
          content_hash,
          total_char_count,
          documents,
          created_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        agent_version_id: { $ref: "#/components/schemas/Uuid" }
        content_hash: { type: string }
        total_char_count: { type: integer, minimum: 1, maximum: 100000 }
        documents:
          type: array
          items: { $ref: "#/components/schemas/SnapshotDocument" }
        created_at: { $ref: "#/components/schemas/IsoTime" }
    KnowledgeDocumentMutation:
      type: object
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/KnowledgeDocument" }
        agent_version:
          oneOf:
            - { $ref: "#/components/schemas/AgentVersion" }
            - { type: "null" }
    AgentSummary:
      type: object
      required: [id, group_id, name, metadata_revision, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        group_id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        description: { type: string }
        metadata_revision: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, archived] }
        current_published_version_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        current_draft_version_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/AgentVersion" }
    AgentVersion:
      type: object
      required:
        [
          id,
          agent_id,
          version_label,
          state,
          revision,
          avatar_config,
          voice_fallback_active,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        agent_id: { $ref: "#/components/schemas/Uuid" }
        version_label: { type: string, pattern: '^V[0-9]+\.[0-9]+$' }
        state: { type: string, enum: [draft, published, superseded] }
        revision: { type: integer, minimum: 0 }
        agent_md: { type: string, maxLength: 12000 }
        avatar_config: { $ref: "#/components/schemas/AvatarConfig" }
        voice_profile_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        effective_voice_profile_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        voice_fallback_active: { type: boolean }
        knowledge_snapshot_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        enabled_documents:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeDocument" }
        publish_blockers:
          type: array
          items: { type: string }
        raw_agent_md_hash: { type: [string, "null"] }
        persona_spec:
          oneOf:
            - { $ref: "#/components/schemas/PersonaSpecV1" }
            - { $ref: "#/components/schemas/PersonaSpecV2" }
            - { type: "null" }
        persona_spec_hash: { type: [string, "null"] }
        persona_compiler_version:
          {
            type: [string, "null"],
            enum: [persona_template_v1, persona_template_v2, null],
          }
        persona_diagnostics:
          type: array
          items: { $ref: "#/components/schemas/PersonaDiagnostic" }
        persona_confirmation_revision:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        persona_confirmed: { type: boolean, default: false }
        student_confirmed_at:
          oneOf:
            - { $ref: "#/components/schemas/IsoTime" }
            - { type: "null" }
    PersonaIdentity:
      type: object
      additionalProperties: false
      required: [name, role, historical_or_cultural_context]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
        historical_or_cultural_context: { type: string, minLength: 1 }
    PersonaSpeakingStyle:
      type: object
      additionalProperties: false
      required: [tone, argument_pattern, concession_style, question_style]
      properties:
        tone: { type: string, minLength: 1 }
        argument_pattern: { type: string, minLength: 1 }
        concession_style: { type: string, minLength: 1 }
        question_style: { type: string, minLength: 1 }
    PersonaSpecV1:
      type: object
      additionalProperties: false
      required:
        [
          identity,
          cultural_lens,
          core_values,
          initial_position,
          speaking_style,
          debate_strategy,
          boundaries,
          source_agent_md_hash,
        ]
      properties:
        schema_version:
          { type: string, const: persona_spec_v1, default: persona_spec_v1 }
        identity: { $ref: "#/components/schemas/PersonaIdentity" }
        cultural_lens: { type: array, minItems: 1, items: { type: string } }
        core_values: { type: array, minItems: 1, items: { type: string } }
        initial_position: { type: string, minLength: 1 }
        speaking_style: { $ref: "#/components/schemas/PersonaSpeakingStyle" }
        debate_strategy: { type: array, minItems: 1, items: { type: string } }
        boundaries: { type: array, minItems: 1, items: { type: string } }
        source_agent_md_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        compiler_version:
          {
            type: string,
            const: persona_template_v1,
            default: persona_template_v1,
          }
    PersonaDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, maxLength: 80, pattern: "^[a-z][a-z0-9_]*$" }
        message: { type: string, minLength: 1, maxLength: 240 }
        field: { type: [string, "null"] }
        line:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
    CompilePersonaRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 0 }
    ConfirmPersonaRequest:
      type: object
      required: [expected_revision, raw_agent_md_hash, persona_spec_hash]
      properties:
        expected_revision: { type: integer, minimum: 0 }
        raw_agent_md_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        persona_spec_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        compiler_version:
          {
            type: string,
            enum: [persona_template_v1, persona_template_v2],
            default: persona_template_v1,
          }
    PersonaCompileResponse:
      type: object
      required: [version_id, revision, compiled, raw_agent_md_hash]
      properties:
        version_id: { $ref: "#/components/schemas/Uuid" }
        revision: { type: integer, minimum: 0 }
        compiled: { type: boolean }
        raw_agent_md_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        persona_spec:
          oneOf:
            - { $ref: "#/components/schemas/PersonaSpecV1" }
            - { $ref: "#/components/schemas/PersonaSpecV2" }
            - { type: "null" }
        persona_spec_hash: { type: [string, "null"] }
        compiler_version:
          {
            type: string,
            enum: [persona_template_v1, persona_template_v2],
            default: persona_template_v1,
          }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/PersonaDiagnostic" }
        persona_confirmed: { type: boolean, default: false }
    UpdateAgentDraftRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 0 }
        agent_md: { type: string, maxLength: 12000 }
        avatar_config: { $ref: "#/components/schemas/AvatarConfig" }
        voice_profile_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
    UpdateAgentMetadataRequest:
      type: object
      required: [expected_metadata_revision]
      properties:
        expected_metadata_revision: { type: integer, minimum: 0 }
        description: { type: [string, "null"], default: "" }
    AvatarConfig:
      type: object
      required:
        [
          template_id,
          material_theme,
          default_expression,
          expression_strength,
          motion_style,
        ]
      properties:
        template_id: { type: string }
        material_theme: { type: string }
        eye_color: { type: [string, "null"] }
        default_expression:
          {
            type: string,
            enum: [neutral, attentive, happy, serious_angry, sad],
          }
        expression_strength: { type: string, enum: [low, medium, high] }
        motion_style: { type: string, enum: [calm, active] }
    AvatarTemplate:
      type: object
      required: [id, name, available, supported_parameters]
      properties:
        id: { type: string }
        name: { type: string }
        available: { type: boolean }
        supported_parameters:
          type: array
          items: { type: string }
    RagPreview:
      type: object
      required:
        [version_id, total_char_count, limit, document_count, index_status]
      properties:
        version_id: { $ref: "#/components/schemas/Uuid" }
        total_char_count: { type: integer }
        limit: { type: integer, const: 100000 }
        document_count: { type: integer }
        index_status: { type: string, enum: [pending, ready, failed] }
        combined_markdown: { type: string }
    RetrievalSource:
      type: object
      required: [source_filename]
      properties:
        source_filename: { type: string }
        chunk_id: { $ref: "#/components/schemas/Uuid" }
    TestChatResponse:
      type: object
      required: [answer, retrieval_status, grounding_mode, sources]
      properties:
        answer: { type: string }
        retrieval_status: { type: string, enum: [matched, no_match] }
        grounding_mode:
          { type: string, enum: [rag_grounded, mixed, general_reasoning] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/RetrievalSource" }
    VoiceProfile:
      type: object
      required: [id, scope, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        scope: { type: string, enum: [system, group] }
        group_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        status:
          {
            type: string,
            enum:
              [
                validating,
                enrolling,
                preview_ready,
                ready,
                deleting,
                outcome_unknown,
                failed,
                deleted,
              ],
          }
        source_filename: { type: string }
        safe_error_code: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/IsoTime" }
    VoicePreviewPlaybackResource:
      type: object
      required: [playback_url, expires_at]
      properties:
        playback_url:
          type: string
          format: uri-reference
        expires_at: { $ref: "#/components/schemas/IsoTime" }
    DebatePlaybackResource:
      type: object
      required: [playback_url, expires_at]
      properties:
        playback_url:
          type: string
          pattern: "^/api/v1/debates/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/audio/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        expires_at: { $ref: "#/components/schemas/IsoTime" }
    PublishedAgentSummary:
      type: object
      required: [agent, current_version, group_name]
      properties:
        group_name: { type: string }
        agent: { $ref: "#/components/schemas/AgentSummary" }
        current_version: { $ref: "#/components/schemas/AgentVersion" }
    DebateParticipantInput:
      type: object
      required: [agent_id, stance_mode]
      properties:
        agent_id: { $ref: "#/components/schemas/Uuid" }
        stance_mode: { type: string, enum: [assigned, open] }
        assigned_stance:
          { type: [string, "null"], enum: [support, oppose, neutral, null] }
        teacher_note: { type: string, default: "" }
    TeachingPrompts:
      type: object
      additionalProperties: false
      required: [zh, en]
      properties:
        zh: { type: string }
        en: { type: string }
    DebateDraftRequest:
      type: object
      required: [topic, participants]
      properties:
        topic:
          type: string
          minLength: 1
          description: >-
            Non-empty topic; any script or symbols are accepted.
        background: { type: string, default: "" }
        teaching_prompts:
          anyOf:
            - $ref: "#/components/schemas/TeachingPrompts"
            - { type: "null" }
          default: null
        output_language: { type: string, enum: [en, zh], default: zh }
        turn_protocol:
          type: [string, "null"]
          enum: [segments_v2, null]
          default: null
          description: New debates use the four-round teaching protocol with paragraph output.
        participants:
          type: array
          minItems: 2
          maxItems: 5
          items: { $ref: "#/components/schemas/DebateParticipantInput" }
        # Ordered multi-expert mutual learning is the only protocol the product
        # surface offers and the only RuleSet a Debate may carry.
        rule_set_id:
          type: string
          default: ordered_multi_expert_mutual_learning_v1
          const: ordered_multi_expert_mutual_learning_v1
        round_count: { type: integer, const: 4, default: 4 }
        total_duration_seconds: { type: "null" }
        turn_duration_seconds: { type: "null" }
    DebateDraftUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/DebateDraftRequest"
        - type: object
          required: [expected_revision]
          properties:
            expected_revision: { type: integer, minimum: 0 }
    AdvancePlaybackRequest:
      type: object
      additionalProperties: false
      required: [expected_control_version, expected_current_turn_id]
      properties:
        expected_control_version: { type: integer, minimum: 0 }
        expected_current_turn_id: { $ref: "#/components/schemas/Uuid" }
    ReleaseDebateRequest:
      type: object
      additionalProperties: false
      required: [confirm_release]
      properties:
        confirm_release:
          const: true
          description: Explicit teacher confirmation; recovery is never implicit.
    PlaybackControlRequest:
      type: object
      additionalProperties: false
      required: [expected_control_version]
      properties:
        expected_control_version: { type: integer, minimum: 0 }
        expected_current_turn_id:
          oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }]
    RetryPreparationRequest:
      type: object
      additionalProperties: false
      required: [expected_control_version, turn_id]
      properties:
        expected_control_version: { type: integer, minimum: 0 }
        turn_id: { $ref: "#/components/schemas/Uuid" }
    DebateParticipant:
      type: object
      required:
        [
          id,
          slot,
          order_index,
          agent_id,
          agent_name,
          agent_version_id,
          version_label,
          knowledge_snapshot_id,
          avatar_config,
          effective_voice_profile_id,
          voice_fallback_active,
          stance_mode,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slot: { type: string, enum: [A, B, C, D, E] }
        order_index: { type: integer, minimum: 0, maximum: 4 }
        agent_id: { $ref: "#/components/schemas/Uuid" }
        agent_name: { type: string }
        agent_version_id: { $ref: "#/components/schemas/Uuid" }
        version_label: { type: string, pattern: '^V[0-9]+\.[0-9]+$' }
        knowledge_snapshot_id: { $ref: "#/components/schemas/Uuid" }
        avatar_config: { $ref: "#/components/schemas/AvatarConfig" }
        effective_voice_profile_id:
          { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        voice_fallback_active: { type: boolean }
        stance_mode: { type: string, enum: [assigned, open] }
        initial_stance:
          { type: [string, "null"], enum: [support, oppose, neutral, null] }
        current_stance:
          { type: [string, "null"], enum: [support, oppose, neutral, null] }
        current_position_summary: { type: string }
    DebateStall:
      type: object
      additionalProperties: false
      required: [turn_id, round_no, safe_error_code]
      properties:
        turn_id: { $ref: "#/components/schemas/Uuid" }
        round_no: { type: integer, minimum: 1 }
        safe_error_code:
          type: string
          description: The server-authored code for why that turn would not generate.
    DebatePreviewProgress:
      type: object
      additionalProperties: false
      required: [prepared_turns, expected_turns, ready]
      properties:
        prepared_turns: { type: integer, minimum: 0 }
        expected_turns: { type: integer, minimum: 1 }
        ready: { type: boolean }
    FreezeFinalRequest:
      type: object
      additionalProperties: false
      required: [expected_control_version]
      properties:
        expected_control_version: { type: integer, minimum: 0 }
    FrozenFinalInput:
      type: object
      additionalProperties: false
      required: [barrage_count, cutoff_sequence]
      properties:
        ready: { type: boolean, const: true, default: true }
        barrage_count: { type: integer, minimum: 0, maximum: 12 }
        cutoff_sequence: { type: integer, minimum: 0 }
    PersonaSpecV2:
      additionalProperties: false
      description:
        "Canonical stored schema for the five-section Persona template.


        V2 intentionally has no ``debate_strategy`` or ``boundaries`` fields.

        Platform rules and debate scheduling remain server-owned, so retaining

        those headings as empty compatibility values would misrepresent authorship

        and make the new schema indistinguishable from a legacy V1 projection."
      properties:
        compiler_version:
          const: persona_template_v2
          default: persona_template_v2
          type: string
        core_values:
          items:
            type: string
          minItems: 1
          type: array
        cultural_lens:
          items:
            type: string
          minItems: 1
          type: array
        identity:
          $ref: "#/components/schemas/PersonaIdentity"
        initial_position:
          minLength: 1
          type: string
        schema_version:
          const: persona_spec_v2
          default: persona_spec_v2
          type: string
        source_agent_md_hash:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        speaking_style:
          $ref: "#/components/schemas/PersonaSpeakingStyle"
      required:
        - identity
        - cultural_lens
        - core_values
        - initial_position
        - speaking_style
        - source_agent_md_hash
      type: object
    DebateSegment:
      additionalProperties: false
      properties:
        support_mode:
          type: [string, "null"]
          enum: [direct, contextual, no_match, null]
        reply_to:
          type:
            - string
            - "null"
        source_ids:
          items:
            type: string
          type: array
        text:
          type: string
      required:
        - text
        - source_ids
        - reply_to
      type: object
    SegmentTurnPublic:
      additionalProperties: false
      properties:
        schema_version:
          const: segment_turn_v2
          default: segment_turn_v2
          type: string
        segments:
          items:
            $ref: "#/components/schemas/DebateSegment"
          type: array
      required:
        - segments
      type: object
    SegmentSourceDetail:
      additionalProperties: false
      properties:
        excerpt:
          type: string
        query_text:
          type:
            - string
            - "null"
        source_filename:
          type: string
        source_id:
          type: string
        version_label:
          type: string
      required:
        - source_id
        - source_filename
        - excerpt
        - version_label
      type: object
    PreviewTurn:
      additionalProperties: false
      properties:
        audio_ready:
          type: boolean
        generation_status:
          type: string
        id:
          format: uuid
          type: string
        participant_id:
          format: uuid
          type: string
        round_no:
          type: integer
        safe_error_code:
          type:
            - string
            - "null"
        segments:
          items:
            $ref: "#/components/schemas/DebateSegment"
          type: array
        sources:
          items:
            $ref: "#/components/schemas/SegmentSourceDetail"
          type: array
        speech:
          type: string
        turn_index:
          type: integer
      required:
        - id
        - participant_id
        - round_no
        - turn_index
        - speech
        - generation_status
        - audio_ready
      type: object
    DebateSummary:
      type: object
      required: [id, course_id, topic, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        course_id: { $ref: "#/components/schemas/Uuid" }
        topic: { type: string }
        status:
          {
            type: string,
            enum: [draft, running, debate_finished, completed, failed, stopped],
          }
        created_at: { $ref: "#/components/schemas/IsoTime" }
        audio_restore_needed: { type: boolean, default: false }
        prepared_turns:
          type: integer
          minimum: 0
          default: 0
          description: Turns already generated, including a draft warming in the background.
        expected_turns:
          type: integer
          minimum: 0
          default: 0
          description: Turns this debate's plan contains, from its own agent and round counts.
        preview:
          oneOf:
            [
              { $ref: "#/components/schemas/DebatePreviewProgress" },
              { type: "null" },
            ]
          default: null
        stall:
          oneOf:
            [{ $ref: "#/components/schemas/DebateStall" }, { type: "null" }]
          default: null
          description: >-
            The turn that stopped this draft warming, if one did. Background
            warming halts at the first turn that will not generate and changes
            no status, so without this a stalled draft is indistinguishable
            from one still thinking. Read from that turn, never stored.
    DebateCleanupRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, expected_control_version]
