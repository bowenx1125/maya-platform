              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - sessionCookie: []
      summary: Regenerate Audio Route
      tags:
        - Debates

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: maya_session
  parameters:
    CourseId:
      {
        name: course_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    UserId:
      {
        name: user_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    GroupId:
      {
        name: group_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    AgentId:
      {
        name: agent_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    VersionId:
      {
        name: version_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    SnapshotId:
      {
        name: snapshot_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    SnapshotDocumentId:
      {
        name: snapshot_document_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    DocumentId:
      {
        name: document_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    VoiceProfileId:
      {
        name: voice_profile_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    DebateId:
      {
        name: debate_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    TurnId:
      {
        name: turn_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    RevisionId:
      {
        name: revision_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Uuid" },
      }
    AccessToken:
      {
        name: access_token,
        in: path,
        required: true,
        schema:
          {
            type: string,
            minLength: 111,
            maxLength: 111,
            pattern: '^v1\.[A-Za-z0-9_-]{64}\.[A-Za-z0-9_-]{43}$',
          },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 16 },
      }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Raw per-session CSRF token returned by AuthSession; required on authenticated mutations.
      schema: { type: string, minLength: 32 }
    Range:
      name: Range
      in: header
      required: false
      description: A single RFC 9110 byte range used by the classroom audio element.
      schema: { type: string, pattern: "^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$" }
    IfRange:
      name: If-Range
      in: header
      required: false
      description: Strong platform ETag or RFC 9110 IMF-fixdate returned for this audio.
      schema:
        oneOf:
          - { type: string, pattern: '^"[0-9a-f]{64}"$' }
          - {
              type: string,
              pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), [0-9]{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT$",
            }
    MediaTicket:
      name: media_ticket
      in: query
      required: false
      description: Short-lived platform ticket returned privately to the active playback controller for current-turn bootstrap; never a supplier token.
      schema:
        {
          type: string,
          minLength: 43,
          maxLength: 43,
          pattern: "^[A-Za-z0-9_-]{43}$",
        }
  headers:
    AcceptRangesBytes:
      description: The platform supports a single byte range.
      schema: { type: string, const: bytes }
    AudioEtag:
      description: Stable strong validator derived from immutable retained audio bytes.
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    ContentLength:
      description: Number of bytes in this response body.
      schema: { type: integer, minimum: 0 }
    ContentRange:
      description: Inclusive byte range and complete representation size.
      schema: { type: string, pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$" }
    UnsatisfiedContentRange:
      description: Complete representation size for an unsatisfied range.
      schema: { type: string, pattern: '^bytes \*/[0-9]+$' }
  requestBodies:
    ControlCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_control_version]
            properties:
              expected_control_version: { type: integer, minimum: 0 }
  responses:
    Error:
      description: Stable platform error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlaybackState:
      description: Authoritative playback state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaybackState" }
  schemas:
    ChatAgent:
      additionalProperties: false
      properties:
        available:
          default: true
          title: Available
          type: boolean
        agent_id:
          format: uuid
          title: Agent Id
          type: string
        avatar_config:
          $ref: '#/components/schemas/AvatarConfig'
        course_id:
          format: uuid
          title: Course Id
          type: string
        name:
          title: Name
          type: string
        version_id:
          format: uuid
          title: Version Id
          type: string
        version_label:
          title: Version Label
          type: string
      required:
      - agent_id
      - version_id
      - course_id
      - name
      - version_label
      - avatar_config
      title: ChatAgent
      type: object
    ChatSession:
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/ChatAgent'
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        revision:
          title: Revision
          type: integer
        turns:
          items:
            $ref: '#/components/schemas/ChatTurn'
          title: Turns
          type: array
      required:
