          title: Chunk Id
          type: string
        excerpt:
          title: Excerpt
          type: string
        filename:
          title: Filename
          type: string
      required:
      - chunk_id
      - filename
      - excerpt
      title: ChatSource
      type: object
    ChatTurn:
      additionalProperties: false
