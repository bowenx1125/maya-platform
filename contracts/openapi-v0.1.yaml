              type: array
              items: { $ref: "#/components/schemas/DebateTurn" }
            playback: { $ref: "#/components/schemas/PlaybackState" }
            interaction_status:
              { type: string, enum: [closed, open, finalized] }
            insight_status:
              { type: string, enum: [not_started, generating, ready, failed] }
            report_status:
              { type: string, enum: [not_started, generating, ready, failed] }
            mutual_learning_synthesis:
              oneOf:
                - { $ref: "#/components/schemas/MutualLearningSynthesisV1" }
                - { type: "null" }
    PlaybackState:
      type: object
