            last_sequence: { type: integer, minimum: 0 }
            rule_set_id:
              { type: string, const: ordered_multi_expert_mutual_learning_v1 }
            round_count: { type: integer, minimum: 2, maximum: 5 }
            output_language: { type: string, enum: [en, zh], default: en }
            turn_protocol:
              {
                type: [string, "null"],
                enum: [segments_v2, null],
                default: null,
              }
            teaching_protocol:
              { type: [string, "null"], enum: [four_round_v1, null] }
