        manifest_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        turn_id:
          oneOf:
            - { type: string, pattern: "^[A-Za-z0-9_.:-]{1,255}$" }
            - { type: "null" }
        confirmation_revision: { type: integer, minimum: 1 }
        confirmed: { type: boolean }
    ProviderDataCallManifestListResponseV1:
