    ProviderDataCallDisclosureV1:
      type: object
      additionalProperties: false
      required:
        [
          supplier_display_name,
          region,
          purpose,
          outbound_field_classes,
          storage_fact,
          no_training_basis,
          retention_setting,
        ]
      properties:
        supplier_display_name: { type: string, minLength: 1 }
        region: { type: string, const: cn-beijing }
        purpose: { type: string, minLength: 1 }
        outbound_field_classes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              [
                topic_and_platform_rules,
                confirmed_structured_persona,
                public_predecessor_speech,
                current_evidence_excerpt,
                opaque_local_id,
                public_agent_name,
                anonymous_insight_summary,
                anonymous_classroom_barrage,
                aggregate_vote_count,
                current_tts_speech,
                server_authored_structure_repair_feedback,
              ]
        storage_fact: { type: string, minLength: 1 }
        no_training_basis: { type: string, minLength: 1 }
        retention_setting: { type: string, minLength: 1 }
